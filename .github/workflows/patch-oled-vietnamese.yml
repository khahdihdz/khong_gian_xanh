name: patch-oled-vietnamese

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[oled-patch]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch Vietnamese bitmap renderer
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          import unicodedata

          p = Path('src/display.cpp')
          s = p.read_text(encoding='utf-8')

          rows = []
          shape_map = {'0306':1, '0302':2, '031B':3}
          tone_map = {'0301':1, '0300':2, '0309':3, '0303':4, '0323':5}
          bases = set('AEIOUYaeiouy')
          for cp in range(0x00C0, 0x1F00):
              ch = chr(cp)
              if not ('VIETNAMESE' in unicodedata.name(ch, '') or cp in (0x0110, 0x0111)):
                  continue
              if cp in (0x0110, 0x0111):
                  rows.append((cp, 'D' if cp == 0x0110 else 'd', 0, 0))
                  continue
              nfd = unicodedata.normalize('NFD', ch)
              base = next((c for c in nfd if c in bases), None)
              if not base:
                  continue
              marks = [f'{ord(c):04X}' for c in nfd if unicodedata.combining(c)]
              shape = next((shape_map[m] for m in marks if m in shape_map), 0)
              tone = next((tone_map[m] for m in marks if m in tone_map), 0)
              rows.append((cp, base, shape, tone))

          table = '\n'.join(f"    {{0x{cp:04X}, '{base}', {shape}, {tone}}}," for cp, base, shape, tone in rows)

          new_vn = f'''// Bitmap Vietnamese: tách chữ nền + hình dạng + dấu thanh để dấu không chồng lên nhau.\nstruct VnGlyph {{ uint32_t cp; char base; uint8_t shape; uint8_t tone; }};\n\nstatic const VnGlyph VN_GLYPHS[] PROGMEM = {{\n{table}\n}};\n\nstatic bool vnDecompose(uint32_t cp, char& base, uint8_t& shape, uint8_t& tone) {{\n    base = 0; shape = 0; tone = 0;\n    for (size_t i = 0; i < sizeof(VN_GLYPHS)/sizeof(VN_GLYPHS[0]); ++i) {{\n        if (pgm_read_dword(&VN_GLYPHS[i].cp) == cp) {{\n            base = (char)pgm_read_byte(&VN_GLYPHS[i].base);\n            shape = pgm_read_byte(&VN_GLYPHS[i].shape);\n            tone = pgm_read_byte(&VN_GLYPHS[i].tone);\n            return true;\n        }}\n    }}\n    return false;\n}}\n\n'''

          s, n = re.subn(r'// Trả về chữ cái nền và loại dấu tiếng Việt\.\nstatic char vnBase\(.*?\n}\n\n(?=static const uint8_t\* glyph)', new_vn, s, count=1, flags=re.S)
          if n != 1:
              raise SystemExit('Không tìm thấy vnBase() để thay thế')

          new_draw = r'''static void drawGlyph(int x, int y, char ch, uint8_t shape=0, uint8_t tone=0) {
    const uint8_t* g = glyph((uint32_t)ch);
    if (!g) return;
    for (int c=0; c<5; ++c) {
        uint8_t bits = pgm_read_byte(&g[c]);
        for (int r=0; r<8; ++r)
            if (bits & (1 << r)) oled.drawPixel(x+c, y+r, SSD1306_WHITE);
    }
    if (shape == 1) {
        oled.drawPixel(x+1, y-2, SSD1306_WHITE);
        oled.drawPixel(x+2, y-3, SSD1306_WHITE);
        oled.drawPixel(x+3, y-2, SSD1306_WHITE);
    } else if (shape == 2) {
        oled.drawPixel(x+1, y-2, SSD1306_WHITE);
        oled.drawPixel(x+2, y-3, SSD1306_WHITE);
        oled.drawPixel(x+3, y-2, SSD1306_WHITE);
    } else if (shape == 3) {
        oled.drawPixel(x+3, y-2, SSD1306_WHITE);
        oled.drawPixel(x+4, y-3, SSD1306_WHITE);
    }
    if (tone == 5) {
        oled.drawPixel(x+2, y+8, SSD1306_WHITE);
    } else if (tone) {
        int ty = shape ? y-5 : y-3;
        if (tone == 1) {
            oled.drawPixel(x+2, ty+1, SSD1306_WHITE);
            oled.drawPixel(x+3, ty, SSD1306_WHITE);
        } else if (tone == 2) {
            oled.drawPixel(x+2, ty+1, SSD1306_WHITE);
            oled.drawPixel(x+1, ty, SSD1306_WHITE);
        } else if (tone == 3) {
            oled.drawPixel(x+1, ty, SSD1306_WHITE);
            oled.drawPixel(x+2, ty+1, SSD1306_WHITE);
            oled.drawPixel(x+3, ty, SSD1306_WHITE);
        } else if (tone == 4) {
            oled.drawPixel(x+1, ty, SSD1306_WHITE);
            oled.drawPixel(x+2, ty+1, SSD1306_WHITE);
            oled.drawPixel(x+3, ty, SSD1306_WHITE);
        }
    }
}

'''
          s, n = re.subn(r'static void drawGlyph\(.*?\n}\n\n(?=static int drawVietnamese)', new_draw, s, count=1, flags=re.S)
          if n != 1:
              raise SystemExit('Không tìm thấy drawGlyph() để thay thế')

          new_viet = r'''static int drawVietnamese(int x, int y, const String& text) {
    size_t i=0, len=text.length();
    while (i < len) {
        uint32_t cp;
        utf8Next(text.c_str(), len, i, cp);
        char base;
        uint8_t shape, tone;
        if (vnDecompose(cp, base, shape, tone)) cp = (uint32_t)base;
        const uint8_t* g = glyph(cp);
        if (g) drawGlyph(x, y, (char)cp, shape, tone);
        x += 6;
    }
    return x;
}

'''
          s, n = re.subn(r'static int drawVietnamese\(.*?\n}\n\n(?=void displaySplashEffect)', new_viet, s, count=1, flags=re.S)
          if n != 1:
              raise SystemExit('Không tìm thấy drawVietnamese() để thay thế')

          replacements = {
              'drawVietnamese(3,14,"KHÔNG GIAN XANH");': 'drawVietnamese(3,5,"KHÔNG GIAN XANH");',
              'drawVietnamese(18,27,"Giám sát môi trường");': 'drawVietnamese(18,19,"Giám sát môi trường");',
              'oled.drawFastHLine(0,10,OLED_WIDTH,SSD1306_WHITE);': 'oled.drawFastHLine(0,13,OLED_WIDTH,SSD1306_WHITE);',
              'drawVietnamese(2,1,"KHÔNG GIAN XANH");': 'drawVietnamese(2,5,"KHÔNG GIAN XANH");',
              'oled.fillCircle(122,4,2,SSD1306_WHITE);': 'oled.fillCircle(122,7,2,SSD1306_WHITE);',
              'drawVietnamese(2,14,"Nhiệt độ");': 'drawVietnamese(2,15,"Nhiệt độ");',
              'oled.setCursor(54,14);': 'oled.setCursor(54,15);',
              'drawVietnamese(54,14,"Lỗi");': 'drawVietnamese(54,15,"Lỗi");',
              'drawVietnamese(2,26,"Độ ẩm");': 'drawVietnamese(2,27,"Độ ẩm");',
              'oled.setCursor(54,26);': 'oled.setCursor(54,27);',
              'drawVietnamese(54,26,"Lỗi");': 'drawVietnamese(54,27,"Lỗi");',
              'drawVietnamese(2,38,"AQI:");': 'drawVietnamese(2,39,"AQI:");',
              'drawVietnamese(26,38,data.aqiLabel);': 'drawVietnamese(26,39,data.aqiLabel);',
              'drawVietnamese(26,38,"Lỗi");': 'drawVietnamese(26,39,"Lỗi");',
              'oled.setCursor(68,38);': 'oled.setCursor(68,39);',
          }
          for a,b in replacements.items():
              s = s.replace(a,b)
          p.write_text(s, encoding='utf-8')
          PY
          git diff --check

      - name: Commit OLED fix and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/display.cpp .github/workflows/patch-oled-vietnamese.yml
          git rm .github/workflows/patch-oled-vietnamese.yml
          git commit -m "Fix Vietnamese bitmap diacritics on OLED [oled-patch]"
          git push origin main
