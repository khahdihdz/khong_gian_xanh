name: Build & Release Firmware

on:
  push:
    branches: [ "main" ]
    paths-ignore:
      - "**.md"
      - ".gitignore"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Lấy mã nguồn
        uses: actions/checkout@v4

      - name: Cài Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Cache thư viện PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            ~/.cache/pip
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}
          restore-keys: |
            pio-${{ runner.os }}-

      - name: Cài PlatformIO
        run: pip install --upgrade platformio

      - name: Build firmware (app)
        run: pio run -e esp32dev

      - name: Chuẩn bị data cho ESP32 LittleFS
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .esp32-data
          cp -a data .esp32-data
          rm -f .esp32-data/pwa.js

          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path('.esp32-data')
          script_re = re.compile(r'<script\b[^>]*\bsrc=["\'][^"\']*pwa\.js[^"\']*["\'][^>]*>\s*</script>\s*', re.I)
          replacements = {
              'href="/mqtt"': 'href="/mqtt_dashboard.html"',
              "href='/mqtt'": "href='/mqtt_dashboard.html'",
              'href="/tools"': 'href="/tools.html"',
              "href='/tools'": "href='/tools.html'",
              'href="/wifi"': 'href="/wifi_config.html"',
              "href='/wifi'": "href='/wifi_config.html'",
          }

          for path in root.rglob('*.html'):
              text = path.read_text(encoding='utf-8')
              text = script_re.sub('', text)
              for old, new in replacements.items():
                  text = text.replace(old, new)
              path.write_text(text, encoding='utf-8')
          PY

          echo "===== ESP32 LittleFS source ====="
          find .esp32-data -maxdepth 2 -type f -printf '%P\n' | sort

          test ! -e .esp32-data/pwa.js
          if grep -RInF 'pwa.js' .esp32-data --include='*.html'; then
            echo "::error::HTML ESP32 vẫn gọi pwa.js"
            exit 1
          fi

          if grep -RInE "href=[\"']/((mqtt)|(tools)|(wifi))[\"']" .esp32-data --include='*.html'; then
            echo "::error::HTML ESP32 vẫn chứa route Cloudflare"
            exit 1
          fi

      - name: Build filesystem image (LittleFS - ESP32 data)
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .original-data
          mv data .original-data
          mv .esp32-data data
          trap 'rm -rf data; mv .original-data data' EXIT

          pio run -e esp32dev -t buildfs

          test -f .pio/build/esp32dev/littlefs.bin
          SIZE=$(stat -c '%s' .pio/build/esp32dev/littlefs.bin)
          echo "LittleFS image: ${SIZE} bytes ($(numfmt --to=iec ${SIZE}))"

          PARTITIONS=.pio/build/esp32dev/partitions.bin
          python3 - "$PARTITIONS" "$SIZE" <<'PY'
          import struct, sys
          path = sys.argv[1]
          image_size = int(sys.argv[2])
          data = open(path, 'rb').read()
          found = []
          for off in range(0, len(data) - 31, 32):
              if data[off:off+2] != b'\xAA\x50':
                  continue
              ptype = data[off+2]
              subtype = data[off+3]
              p_offset, p_size = struct.unpack_from('<II', data, off+4)
              label = data[off+8:off+24].split(b'\0', 1)[0].decode('ascii', 'replace')
              if ptype == 0x01 and subtype in (0x82, 0x83):
                  found.append((label, p_offset, p_size))
          if not found:
              raise SystemExit('Không tìm thấy phân vùng filesystem trong partitions.bin')
          print('Filesystem partitions:')
          for item in found:
              print('  ', item)
          max_size = max(x[2] for x in found)
          if image_size > max_size:
              raise SystemExit(f'LittleFS image {image_size} bytes vượt partition {max_size} bytes')
          print(f'OK: LittleFS {image_size} <= partition {max_size}')
          PY

      - name: Kiểm tra nội dung LittleFS
        shell: bash
        run: |
          set -euo pipefail
          test -f .pio/build/esp32dev/littlefs.bin
          test ! -e .esp32-data/pwa.js
          if grep -RInF 'pwa.js' .esp32-data --include='*.html' --include='*.js'; then
            echo "::error::Phát hiện pwa.js trong nguồn LittleFS ESP32"
            exit 1
          fi

      - name: Đọc số phiên bản từ config.h
        id: ver
        shell: bash
        run: |
          VERSION=$(grep -oP '#define FIRMWARE_VERSION\s+"\K[^"]+' src/config.h)
          test -n "$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Chuẩn bị file đính kèm Release
        id: files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release_assets
          SHORT_SHA=$(git rev-parse --short HEAD)
          TAG="v${{ steps.ver.outputs.version }}-${SHORT_SHA}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          cp .pio/build/esp32dev/firmware.bin "release_assets/khong-gian-xanh-firmware-v${{ steps.ver.outputs.version }}.bin"
          cp .pio/build/esp32dev/littlefs.bin "release_assets/khong-gian-xanh-littlefs-v${{ steps.ver.outputs.version }}.bin"

      - name: Đóng gói bộ file cho esp32-android-toolkit
        run: |
          set -euo pipefail
          mkdir -p toolkit_bundle/firmware
          cp .pio/build/esp32dev/bootloader.bin toolkit_bundle/firmware/bootloader.bin
          cp .pio/build/esp32dev/partitions.bin toolkit_bundle/firmware/partitions.bin
          cp .pio/build/esp32dev/firmware.bin toolkit_bundle/firmware/firmware.bin
          cp .pio/build/esp32dev/littlefs.bin toolkit_bundle/firmware/littlefs.bin
          BOOT_APP0="$(find ~/.platformio/packages/framework-arduinoespressif32 -name boot_app0.bin | head -n1)"
          test -n "$BOOT_APP0"
          cp "$BOOT_APP0" toolkit_bundle/firmware/boot_app0.bin
          cd toolkit_bundle
          zip -r "../release_assets/khong-gian-xanh-toolkit-v${{ steps.ver.outputs.version }}.zip" firmware

      - name: Tạo Release & đính kèm file .bin
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.files.outputs.tag }}
          name: "Không Gian Xanh v${{ steps.ver.outputs.version }} (build ${{ github.run_number }})"
          body: |
            🌿 **Không Gian Xanh** - Build tự động từ commit `${{ github.sha }}`

            ### File đính kèm
            - firmware ESP32
            - LittleFS giao diện Web ESP32: index.html, mqtt_dashboard.html, tools.html, wifi_config.html và tài nguyên cần thiết
            - Toolkit cho esp32-android-toolkit/Termux

            `pwa.js` chỉ dành cho Cloudflare Pages và không được đóng gói vào LittleFS ESP32.
          files: |
            release_assets/*.bin
            release_assets/*.zip
          generate_release_notes: true
