name: Build & Release Firmware

on:
  push:
    branches: ["main"]
    paths-ignore:
      - "**.md"
      - ".gitignore"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Lấy mã nguồn
        uses: actions/checkout@v4

      - name: Cài Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cài PlatformIO
        run: python -m pip install --upgrade pip platformio

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            ~/.cache/pip
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}
          restore-keys: |
            pio-${{ runner.os }}-

      - name: Kiểm tra PlatformIO
        run: pio --version

      - name: Build firmware ESP32
        run: pio run -e esp32dev -v

      - name: Build filesystem LittleFS
        run: pio run -e esp32dev -t buildfs -v

      - name: Kiểm tra artifact build
        run: |
          set -eux
          test -s .pio/build/esp32dev/firmware.bin
          test -s .pio/build/esp32dev/littlefs.bin
          test -s .pio/build/esp32dev/bootloader.bin
          test -s .pio/build/esp32dev/partitions.bin
          ls -lh .pio/build/esp32dev/*.bin

      - name: Đọc số phiên bản từ config.h
        id: ver
        shell: bash
        run: |
          VERSION=$(sed -n 's/^#define[[:space:]]\+FIRMWARE_VERSION[[:space:]]\+"\([^"]*\)".*/\1/p' src/config.h | head -n1)
          if [ -z "$VERSION" ]; then
            echo "::error::Không đọc được FIRMWARE_VERSION từ src/config.h"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Chuẩn bị file Release
        id: files
        shell: bash
        run: |
          set -eux
          mkdir -p release_assets toolkit_bundle/firmware
          SHORT_SHA=$(git rev-parse --short HEAD)
          TAG="v${{ steps.ver.outputs.version }}-${SHORT_SHA}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

          cp .pio/build/esp32dev/firmware.bin \
            "release_assets/khong-gian-xanh-firmware-v${{ steps.ver.outputs.version }}.bin"
          cp .pio/build/esp32dev/littlefs.bin \
            "release_assets/khong-gian-xanh-littlefs-v${{ steps.ver.outputs.version }}.bin"

      - name: Đóng gói esp32-android-toolkit
        shell: bash
        run: |
          set -eux
          BUILD_DIR="$HOME/.platformio/packages/framework-arduinoespressif32"

          cp .pio/build/esp32dev/bootloader.bin toolkit_bundle/firmware/bootloader.bin
          cp .pio/build/esp32dev/partitions.bin toolkit_bundle/firmware/partitions.bin
          cp .pio/build/esp32dev/firmware.bin toolkit_bundle/firmware/firmware.bin
          cp .pio/build/esp32dev/littlefs.bin toolkit_bundle/firmware/littlefs.bin

          BOOT_APP0=$(find "$BUILD_DIR" -type f -name boot_app0.bin -print -quit)
          if [ -z "$BOOT_APP0" ]; then
            echo "::error::Không tìm thấy boot_app0.bin trong $BUILD_DIR"
            find "$BUILD_DIR" -maxdepth 5 -type f -name '*boot*app*' -print || true
            exit 1
          fi
          cp "$BOOT_APP0" toolkit_bundle/firmware/boot_app0.bin

          test -s toolkit_bundle/firmware/bootloader.bin
          test -s toolkit_bundle/firmware/partitions.bin
          test -s toolkit_bundle/firmware/boot_app0.bin
          test -s toolkit_bundle/firmware/firmware.bin
          test -s toolkit_bundle/firmware/littlefs.bin

          cd toolkit_bundle
          zip -r "../release_assets/khong-gian-xanh-toolkit-v${{ steps.ver.outputs.version }}.zip" firmware

      - name: Tạo Release bằng GitHub CLI
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -eux
          TAG="${{ steps.files.outputs.tag }}"

          cat > release_notes.md <<EOF
🌿 Không Gian Xanh - Build tự động từ commit ${{ github.sha }}

### File đính kèm
- khong-gian-xanh-firmware-v${{ steps.ver.outputs.version }}.bin — firmware ESP32.
- khong-gian-xanh-littlefs-v${{ steps.ver.outputs.version }}.bin — giao diện web LittleFS.
- khong-gian-xanh-toolkit-v${{ steps.ver.outputs.version }}.zip — bộ 5 file cho esp32-android-toolkit.

### Ghi chú
Muốn tăng phiên bản, sửa FIRMWARE_VERSION trong src/config.h rồi push lên main.
EOF

          gh release create "$TAG" \
            release_assets/*.bin \
            release_assets/*.zip \
            --repo "${{ github.repository }}" \
            --title "Không Gian Xanh v${{ steps.ver.outputs.version }} (build ${{ github.run_number }})" \
            --notes-file release_notes.md
