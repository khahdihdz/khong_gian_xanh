name: Dong bo header footer chung

on: push

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Them common.js vao moi trang HTML
        run: |
          python3 - <<'PY'
          from pathlib import Path
          changed = False
          roots = [Path('data'), Path('cloud-dashboard')]
          excluded = {'header.html', 'footer.html'}
          for base in roots:
              if not base.exists():
                  continue
              for path in base.rglob('*.html'):
                  if path.name in excluded:
                      continue
                  text = path.read_text(encoding='utf-8')
                  marker = '<script src="/common.js"></script>'
                  if marker in text:
                      continue
                  if '</body>' in text:
                      text = text.replace('</body>', marker + '</body>', 1)
                  else:
                      text += '\n' + marker + '\n'
                  path.write_text(text, encoding='utf-8')
                  changed = True
          if changed:
              Path('/tmp/kgx_changed').write_text('1')
          PY

      - name: Commit va push
        run: |
          if [ ! -f /tmp/kgx_changed ]; then
            echo "Khong co HTML nao can cap nhat."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data cloud-dashboard
          git commit -m "Dong bo header footer chung cho toan bo HTML"
          git push
