<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Không Gian Xanh — Cloud WebSocket</title>
<style>
:root{--bg:#0c130c;--p:#182016;--p2:#1e2a1a;--l:#31432c;--t:#f5f8ee;--m:#a7b69c;--g:#4ade80;--r:#f87171}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font-family:system-ui,-apple-system,sans-serif}header{padding:16px 20px;border-bottom:1px solid var(--l);display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}h1{font-size:1.25rem;margin:0}small{color:var(--m)}button{border:1px solid var(--l);background:var(--p2);color:var(--t);padding:9px 14px;border-radius:10px;cursor:pointer}main{max-width:1100px;margin:auto;padding:20px}.status{padding:12px 15px;border:1px solid var(--l);border-radius:12px;background:var(--p);margin-bottom:18px}.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--r);margin-right:7px}.dot.on{background:var(--g);box-shadow:0 0 8px var(--g)}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}.card{background:var(--p);border:1px solid var(--l);border-radius:16px;padding:18px}.label{font-size:.78rem;color:var(--m)}.value{font-size:1.8rem;font-weight:600;margin-top:8px}.panel{margin-top:18px;background:var(--p);border:1px solid var(--l);border-radius:16px;padding:18px}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.row input{width:100%;padding:10px;border-radius:9px;border:1px solid var(--l);background:var(--p2);color:var(--t)}label{font-size:.78rem;color:var(--m);display:block;margin-bottom:5px}pre{white-space:pre-wrap;word-break:break-word;color:var(--m)}@media(max-width:600px){.row{grid-template-columns:1fr}}
</style></head>
<body><header><div><h1>🌿 Không Gian Xanh</h1><small>Cloud WebSocket — không MQTT</small></div><button id="settings">⚙️ Cấu hình</button></header>
<main><div class="status"><span id="dot" class="dot"></span><span id="conn">Chưa kết nối</span><span id="last"></span></div>
<div class="grid"><div class="card"><div class="label">🌡️ Nhiệt độ</div><div class="value" id="temp">--</div></div><div class="card"><div class="label">💧 Độ ẩm</div><div class="value" id="hum">--</div></div><div class="card"><div class="label">🧪 TVOC</div><div class="value" id="tvoc">--</div></div><div class="card"><div class="label">🫧 eCO₂</div><div class="value" id="eco2">--</div></div><div class="card"><div class="label">🍃 AQI</div><div class="value" id="aqi">--</div></div></div>
<div class="panel"><b>Trạng thái thiết bị</b><pre id="raw">Đang chờ dữ liệu...</pre></div>
<div class="panel" id="config" hidden><h3>Cấu hình Cloud WebSocket</h3><div class="row"><div><label>URL Worker (wss://...)</label><input id="url" placeholder="wss://ten-worker.workers.dev"></div><div><label>Device ID (ESP32 MAC)</label><input id="device" placeholder="Ví dụ: 30AE..."></div><div><label>READ_TOKEN</label><input id="token" type="password" placeholder="Token Cloudflare Worker"></div></div><p><button id="save">Lưu & kết nối</button> <button id="close">Đóng</button></p></div></main>
<script>
const K={url:'kgx_ws_url',device:'kgx_device_id',token:'kgx_read_token'};let ws=null,retry=null;const $=id=>document.getElementById(id);function cfg(){return{url:localStorage.getItem(K.url)||'',device:localStorage.getItem(K.device)||'',token:localStorage.getItem(K.token)||''}}function showCfg(){const c=cfg();$('url').value=c.url;$('device').value=c.device;$('token').value=c.token;$('config').hidden=false}function status(on,text){$('dot').className='dot'+(on?' on':'');$('conn').textContent=text}function connect(){if(ws){try{ws.close()}catch(e){}}const c=cfg();if(!c.url||!c.device||!c.token){status(false,'Chưa cấu hình Cloud WebSocket');showCfg();return}let base=c.url.replace(/\/$/,'');if(base.endsWith('/ws/browser'))base=base.slice(0,-11);const u=base+'/ws/browser?device='+encodeURIComponent(c.device)+'&token='+encodeURIComponent(c.token);status(false,'Đang kết nối Cloud...');ws=new WebSocket(u);ws.onopen=()=>status(true,'Cloud WebSocket đã kết nối');ws.onclose=()=>{status(false,'Cloud mất kết nối — tự kết nối lại');clearTimeout(retry);retry=setTimeout(connect,5000)};ws.onerror=()=>status(false,'Lỗi Cloud WebSocket');ws.onmessage=e=>{try{const d=JSON.parse(e.data);if(d.type==='relay'){status(!!d.device_online,d.device_online?'ESP32 đang online':'ESP32 offline');return}if(d.type==='sensor'||d.temperature!==undefined)update(d)}catch(err){$('raw').textContent=e.data}}}function update(d){$('temp').textContent=Number(d.temperature).toFixed(1)+' °C';$('hum').textContent=Number(d.humidity).toFixed(1)+' %';$('tvoc').textContent=d.tvoc+' ppb';$('eco2').textContent=d.eco2+' ppm';$('aqi').textContent=d.aqi+' — '+(d.status||'');$('raw').textContent=JSON.stringify(d,null,2);$('last').textContent=' · '+new Date().toLocaleTimeString('vi-VN')}$('settings').onclick=showCfg;$('close').onclick=()=>$('config').hidden=true;$('save').onclick=()=>{localStorage.setItem(K.url,$('url').value.trim());localStorage.setItem(K.device,$('device').value.trim().toUpperCase());localStorage.setItem(K.token,$('token').value.trim());$('config').hidden=true;connect()};connect();
</script></body></html>
