<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Không Gian Xanh — Giám sát môi trường phòng</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.9/dist/chart.umd.min.js"></script>
<style>
:root{--bg:#0c130c;--p:#182016;--p2:#1e2a1a;--l:#31432c;--t:#f5f8ee;--m:#a7b69c;--g:#4ade80;--r:#f87171;--a:#fbbf24}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font-family:system-ui,sans-serif}.wrap{max-width:1100px;margin:auto;padding:20px}.panel{background:var(--p);border:1px solid var(--l);border-radius:20px;padding:20px;margin-bottom:18px}.hero{display:grid;grid-template-columns:170px 1fr;gap:24px;align-items:center}.leaf{text-align:center;color:var(--m);font-size:.75rem;text-transform:uppercase;letter-spacing:1.4px}.leaf svg{width:120px}.readouts{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}.readout{background:var(--p2);border:1px solid var(--l);border-radius:12px;padding:12px}.name{color:var(--m);font-size:.72rem}.value{font-size:1rem;margin-top:6px}.aqi{font-size:2.2rem;margin:4px 0 18px}.good{color:var(--g)}.bad{color:var(--r)}.label{color:var(--m);font-size:.8rem}.chart{height:300px}.range{display:flex;gap:4px;background:var(--p2);padding:4px;border-radius:99px;width:max-content;margin-bottom:12px}.range button{border:0;background:transparent;color:var(--m);padding:7px 12px;border-radius:99px}.range button.active{background:var(--g);color:#071007}.status{padding:10px 12px;border:1px solid var(--l);border-radius:10px;color:var(--m);font-size:.8rem}.notice{font-size:.8rem;margin-top:10px;color:var(--a)}@media(max-width:750px){.hero{grid-template-columns:1fr}.readouts{grid-template-columns:repeat(2,1fr)}.wrap{padding:12px}.chart{height:240px}}
</style></head>
<body>
<main class="wrap">
<section class="panel hero"><div class="leaf"><svg viewBox="0 0 100 100"><path d="M50 8C78 14 92 40 78 66C66 86 40 94 22 88C10 68 10 30 50 8Z" fill="rgba(74,222,128,.12)" stroke="#4ade80" stroke-width="4"/><path d="M50 12C48 40 44 68 24 86M50 30C60 34 68 40 72 46M44 52C54 54 62 58 68 64" fill="none" stroke="#4ade80" stroke-width="3"/></svg><div>Tình trạng phòng</div></div><div><div class="label">Chất lượng không khí — dữ liệu trực tiếp từ ESP32</div><div id="aqi" class="aqi">--</div><div class="readouts"><div class="readout"><div class="name">🌡️ Nhiệt độ — SHT31</div><div id="temp" class="value">--</div></div><div class="readout"><div class="name">💧 Độ ẩm — SHT31</div><div id="hum" class="value">--</div></div><div class="readout"><div class="name">📶 WiFi</div><div id="wifi" class="value">--</div></div><div class="readout"><div class="name">🧪 TVOC — ENS160</div><div id="tvoc" class="value">--</div></div><div class="readout"><div class="name">🫧 eCO2 — ENS160</div><div id="eco2" class="value">--</div></div></div></div></section>
<section class="panel"><h2>📈 Nhật ký dữ liệu thực tế</h2><div class="range"><button data-hours="1">1 giờ</button><button data-hours="6">6 giờ</button><button data-hours="12" class="active">12 giờ</button><button data-hours="24">24 giờ</button></div><div class="chart"><canvas id="chart"></canvas></div><div id="status" class="status">Đang kết nối trực tiếp tới ESP32...</div><div id="notice" class="notice">Dữ liệu đi trực tiếp qua HTTP/WebSocket.</div></section>
</main>
<script>
window.kgxDashboardRealtime=true;
const $=id=>document.getElementById(id);let chart=null,hours=12,rows=[],ws=null;
function status(t,c=''){$('status').textContent=t;$('status').className='status '+c}
function update(d){if(!d||typeof d!=='object')return;window.dispatchEvent(new CustomEvent('kgx-realtime',{detail:d}));const sht=d.sht31_ok!==false,ens=d.ens160_ok!==false,t=Number(d.temperature),h=Number(d.humidity),tv=Number(d.tvoc),co=Number(d.eco2),aq=Number(d.aqi);$('temp').textContent=sht&&Number.isFinite(t)?t.toFixed(1)+' °C':'--';$('hum').textContent=sht&&Number.isFinite(h)?h.toFixed(1)+' %':'--';$('wifi').textContent=d.wifi_status?d.wifi_status+(d.wifi_rssi!==undefined?' ('+d.wifi_rssi+' dBm)':''):(d.wifi_rssi!==undefined?d.wifi_rssi+' dBm':'--');$('tvoc').textContent=ens&&Number.isFinite(tv)?tv+' ppb':'--';$('eco2').textContent=ens&&Number.isFinite(co)?co+' ppm':'--';$('aqi').textContent=d.status|| (Number.isFinite(aq)?'AQI '+aq:'--');$('aqi').className='aqi '+(d.warning?'bad':'');$('notice').textContent=d.warning?'⚠️ '+(d.warning_reason||'Cảnh báo chất lượng không khí.'):'✅ Dữ liệu realtime từ SHT31 + ENS160 qua ESP32';const time=d.timestamp?Number(d.timestamp):Math.floor(Date.now()/1000);rows.push({time,temperature:sht&&Number.isFinite(t)?t:null,humidity:sht&&Number.isFinite(h)?h:null,tvoc:ens&&Number.isFinite(tv)?tv:null,eco2:ens&&Number.isFinite(co)?co:null});if(rows.length>2000)rows.shift();draw()}
function makeChart(){if(!window.Chart)return;chart=new Chart($('chart'),{type:'line',data:{labels:[],datasets:[{label:'Nhiệt độ °C',data:[]},{label:'Độ ẩm %',data:[]},{label:'TVOC ppb',data:[]},{label:'eCO2 ppm',data:[]}]},options:{responsive:true,maintainAspectRatio:false,animation:false,interaction:{mode:'index',intersect:false}}})}
function draw(){if(!chart)return;const cut=Math.floor(Date.now()/1000)-hours*3600,a=rows.filter(x=>x.time>=cut);chart.data.labels=a.map(x=>new Date(x.time*1000).toLocaleTimeString('vi-VN',{hour:'2-digit',minute:'2-digit'}));chart.data.datasets[0].data=a.map(x=>x.temperature);chart.data.datasets[1].data=a.map(x=>x.humidity);chart.data.datasets[2].data=a.map(x=>x.tvoc);chart.data.datasets[3].data=a.map(x=>x.eco2);chart.update('none')}
async function history(){try{const r=await fetch('/api/history?hours='+hours,{cache:'no-store'});if(!r.ok)return;const d=await r.json();if(Array.isArray(d)){rows=d.map(x=>({time:Number(x.timestamp||x.time||0),temperature:Number.isFinite(Number(x.temperature))?Number(x.temperature):null,humidity:Number.isFinite(Number(x.humidity))?Number(x.humidity):null,tvoc:Number.isFinite(Number(x.tvoc))?Number(x.tvoc):null,eco2:Number.isFinite(Number(x.eco2))?Number(x.eco2):null})).filter(x=>x.time>0);draw()}}catch(e){}}
function connect(){if(ws){try{ws.close()}catch(e){}}const proto=location.protocol==='https:'?'wss':'ws';ws=new WebSocket(proto+'://'+location.host+'/ws');ws.onopen=()=>status('✅ WebSocket ESP32 đã kết nối.','good');ws.onmessage=e=>{try{update(JSON.parse(e.data))}catch(x){}};ws.onerror=()=>status('❌ Lỗi WebSocket ESP32','bad');ws.onclose=()=>{status('⏳ WebSocket mất kết nối, đang kết nối lại...','warn');setTimeout(connect,1500)}}
document.querySelectorAll('[data-hours]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-hours]').forEach(x=>x.classList.remove('active'));b.classList.add('active');hours=Number(b.dataset.hours);history()});makeChart();history();connect();setInterval(history,30000);
</script><script src="/common.js"></script>
</body></html>
