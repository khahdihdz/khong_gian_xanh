<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Không Gian Xanh — Giám Sát Môi Trường Phòng</title>
<meta name="theme-color" content="#0c130c">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Be+Vietnam+Pro:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0c130c;--panel:#182016;--panel2:#1e2a1a;--line:#31432c;--text:#f5f8ee;--muted:#a7b69c;--muted2:#77876c;--green:#4ade80;--amber:#fbbf24;--orange:#fb923c;--red:#f87171}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(1000px 500px at 15% -10%,rgba(74,222,128,.1),transparent 60%),var(--bg);color:var(--text);font-family:'Be Vietnam Pro',system-ui,sans-serif;padding-bottom:40px}.topbar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding:15px 20px;border-bottom:1px solid var(--line)}.brand{font:600 1.35rem 'Fraunces',serif}.brand small{display:block;color:var(--muted2);font:500 .65rem 'Be Vietnam Pro',sans-serif;letter-spacing:1.4px;text-transform:uppercase}.top-right{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.pill,.btn{border:1px solid var(--line);background:var(--panel);border-radius:99px;padding:7px 12px;font-size:.78rem;color:var(--muted);text-decoration:none}.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--red);margin-right:6px}.dot.on{background:var(--green);box-shadow:0 0 7px var(--green)}.wrap{max-width:1180px;margin:auto;padding:0 20px}.grid{display:grid;grid-template-columns:1fr;gap:20px;margin-top:24px}.hero,.panel{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:22px}.hero{display:grid;grid-template-columns:180px 1fr;gap:24px;align-items:center}.leaf{display:flex;flex-direction:column;align-items:center;color:var(--muted2);font-size:.7rem;letter-spacing:1.5px;text-transform:uppercase}.leaf svg{width:125px;height:125px}.leaf path{fill:rgba(74,222,128,.15);stroke:var(--green);stroke-width:5}.label{font-size:.78rem;color:var(--muted)}#aqi{font:600 2.5rem 'Fraunces',serif;margin:2px 0 18px}.readouts{display:grid;grid-template-columns:repeat(5,1fr);gap:14px}.readout{min-width:0}.readout .name{font-size:.72rem;color:var(--muted2)}.readout .value{font:500 1rem 'JetBrains Mono',monospace;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.panel h2{font:500 1.15rem 'Fraunces',serif;margin:0 0 14px}.range{display:flex;gap:5px;background:var(--panel2);padding:4px;border-radius:99px;float:right;margin-top:-42px}.range button{border:0;background:transparent;color:var(--muted);padding:6px 12px;border-radius:99px;cursor:pointer}.range button.active{background:var(--green);color:#071007}.chart{height:300px;position:relative}.note{color:var(--muted2);font-size:.76rem;margin-top:10px}.statusline{margin-top:14px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;color:var(--muted);font-size:.8rem}.warning{display:none;margin:15px 0;padding:11px 14px;border-radius:10px;color:#ffd6cf;background:rgba(248,113,113,.15);border:1px solid rgba(248,113,113,.35)}@media(max-width:800px){.hero{grid-template-columns:1fr;text-align:center}.readouts{grid-template-columns:repeat(2,1fr);text-align:left}.leaf{align-items:center}}@media(max-width:460px){.topbar{padding:12px 14px}.wrap{padding:0 12px}.hero,.panel{padding:16px;border-radius:16px}.readouts{gap:12px}.range{float:none;margin:0 0 12px;width:max-content}.chart{height:240px}}
</style>
</head>
<body>
<nav class="topbar"><div class="brand">🌿 Không Gian Xanh<small>Giám sát môi trường phòng</small></div><div class="top-right"><span class="pill"><span id="dot" class="dot"></span><span id="conn">Đang kết nối...</span></span><span id="clock" class="pill">--:--:--</span><a href="/tools.html" class="btn">⚙️ Chức năng</a><a href="https://khahdihdz.github.io" target="_blank" class="btn">❤️ Ủng hộ</a></div></nav>
<main class="wrap"><div id="warning" class="warning">⚠️ <span id="warningText"></span></div><div class="grid">
<section class="hero"><div class="leaf"><svg viewBox="0 0 100 100"><path d="M50 8C78 14 92 40 78 66C66 86 40 94 22 88C10 68 10 30 50 8Z"/><path d="M50 12C48 40 44 68 24 86" fill="none" stroke="var(--green)" stroke-width="3"/><path d="M50 30C60 34 68 40 72 46M44 52C54 54 62 58 68 64" fill="none" stroke="var(--green)" stroke-width="3"/></svg><span>Tình trạng phòng</span></div><div><div class="label">Chất lượng không khí</div><div id="aqi">--</div><div class="readouts"><div class="readout"><div class="name">🌡️ Nhiệt độ</div><div id="temp" class="value">--</div></div><div class="readout"><div class="name">💧 Độ ẩm</div><div id="hum" class="value">--</div></div><div class="readout"><div class="name">📶 WiFi</div><div id="wifi" class="value">--</div></div><div class="readout"><div class="name">🧪 TVOC</div><div id="tvoc" class="value">--</div></div><div class="readout"><div class="name">🫧 eCO2</div><div id="eco2" class="value">--</div></div></div></div></section>
<section class="panel"><h2>📈 Nhật ký theo thời gian</h2><div class="range"><button data-hours="1">1 giờ</button><button data-hours="6">6 giờ</button><button data-hours="12" class="active">12 giờ</button><button data-hours="24">24 giờ</button></div><div class="chart"><canvas id="historyChart"></canvas></div><div id="modeNote" class="note"></div><div id="statusline" class="statusline">Đang chờ dữ liệu MQTT...</div></section>
</div></main>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<script>
const isPages=location.hostname.endsWith('.pages.dev');
const $=id=>document.getElementById(id);
let history=[];
function setConnection(on,text){$('dot').className='dot'+(on?' on':'');$('conn').textContent=text}
function updateUI(d){
 const temp=Number(d.temperature),hum=Number(d.humidity),tvoc=Number(d.tvoc),eco2=Number(d.eco2);
 $('temp').textContent=Number.isFinite(temp)&&temp>-90?temp.toFixed(1)+' °C':'--';
 $('hum').textContent=Number.isFinite(hum)&&hum>=0?hum.toFixed(1)+' %':'--';
 $('tvoc').textContent=Number.isFinite(tvoc)?tvoc+' ppb':'--';
 $('eco2').textContent=Number.isFinite(eco2)?eco2+' ppm':'--';
 $('aqi').textContent=d.status??(d.aqi!=null?'AQI '+d.aqi:'--');
 $('wifi').textContent=d.wifi_status??'Đã kết nối';
 if(d.warning){$('warning').style.display='block';$('warningText').textContent=d.warning_reason||'Chất lượng không khí cần chú ý.'}else $('warning').style.display='none';
 const ts=Number(d.timestamp)||Math.floor(Date.now()/1000);$('clock').textContent=new Date(ts*1000).toLocaleTimeString('vi-VN');
 $('statusline').textContent='Cập nhật: '+new Date(ts*1000).toLocaleString('vi-VN');
 if(isPages){history.push({time:ts,temperature:temp,humidity:hum,tvoc:tvoc,eco2:eco2,aqi:Number(d.aqi)||0});if(history.length>2000)history.shift();localStorage.setItem('kgx_mqtt_history',JSON.stringify(history));updateChart(12)}
}
const chart=new Chart($('historyChart').getContext('2d'),{type:'line',data:{labels:[],datasets:[{label:'Nhiệt độ °C',data:[],yAxisID:'y'},{label:'Độ ẩm %',data:[],yAxisID:'y'},{label:'TVOC ppb',data:[],yAxisID:'y1'},{label:'eCO2 ppm',data:[],yAxisID:'y1'}]},options:{responsive:true,maintainAspectRatio:false,interaction:{mode:'index',intersect:false},scales:{x:{ticks:{color:'#a7b69c'}},y:{ticks:{color:'#a7b69c'}},y1:{position:'right',ticks:{color:'#a7b69c'}}},plugins:{legend:{labels:{color:'#e7ecdc'}}}}});
function updateChart(hours){const cutoff=Math.floor(Date.now()/1000)-hours*3600;const rows=history.filter(x=>x.time>=cutoff);chart.data.labels=rows.map(x=>new Date(x.time*1000).toLocaleTimeString('vi-VN',{hour:'2-digit',minute:'2-digit'}));chart.data.datasets[0].data=rows.map(x=>x.temperature);chart.data.datasets[1].data=rows.map(x=>x.humidity);chart.data.datasets[2].data=rows.map(x=>x.tvoc);chart.data.datasets[3].data=rows.map(x=>x.eco2);chart.update('none')}
document.querySelectorAll('[data-hours]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-hours]').forEach(x=>x.classList.remove('active'));b.classList.add('active');updateChart(Number(b.dataset.hours))});
if(isPages){
 $('modeNote').textContent='Cloudflare Pages: dữ liệu realtime lấy trực tiếp từ MQTT WebSocket.';
 try{history=JSON.parse(localStorage.getItem('kgx_mqtt_history')||'[]')}catch(e){history=[]}
 function mqttConnect(){
  const cfg=JSON.parse(localStorage.getItem('kgx_mqtt_personal_v2')||'{}');const pass=sessionStorage.getItem('kgx_mqtt_password_session')||'';
  if(!cfg.host||!cfg.device||!pass){setConnection(false,'Chưa cấu hình MQTT');$('statusline').textContent='Mở Chức năng → MQTT cá nhân để cấu hình Broker, Username, Password và Device ID.';return}
  const topic='khonggianxanh/'+cfg.device+'/telemetry';
  const c=mqtt.connect('wss://'+cfg.host+':'+(Number(cfg.port)||8884)+'/mqtt',{username:cfg.user,password:pass,clientId:'kgx-index-'+Math.random().toString(16).slice(2),clean:false,keepalive:30,reconnectPeriod:3000,connectTimeout:10000});
  c.on('connect',()=>{setConnection(true,'Đã kết nối MQTT');$('statusline').textContent='Đã kết nối HiveMQ WebSocket · '+topic;c.subscribe(topic,{qos:1})});
  c.on('reconnect',()=>setConnection(false,'Đang kết nối lại...'));c.on('offline',()=>setConnection(false,'MQTT offline'));c.on('error',e=>{setConnection(false,'MQTT lỗi');console.error(e)});
  c.on('message',(t,p)=>{try{updateUI(JSON.parse(p.toString()))}catch(e){console.error('Telemetry JSON lỗi',e)}})
 }
 const s=document.createElement('script');s.src='https://unpkg.com/mqtt/dist/mqtt.min.js';s.onload=mqttConnect;document.head.appendChild(s);
}else{
 $('modeNote').textContent='ESP32: dữ liệu realtime lấy từ WebSocket nội bộ của thiết bị.';
 let ws,retry;
 function connectWs(){ws=new WebSocket((location.protocol==='https:'?'wss://':'ws://')+location.host+'/ws');ws.onopen=()=>setConnection(true,'Đã kết nối');ws.onclose=()=>{setConnection(false,'Mất kết nối, đang thử lại...');clearTimeout(retry);retry=setTimeout(connectWs,3000)};ws.onerror=()=>ws.close();ws.onmessage=e=>{try{updateUI(JSON.parse(e.data))}catch(x){}}}
 connectWs();
 async function loadLocalHistory(hours){try{const r=await fetch('/api/history?hours='+hours);history=await r.json();chart.data.labels=history.map(x=>new Date(x.time*1000).toLocaleTimeString('vi-VN',{hour:'2-digit',minute:'2-digit'}));chart.data.datasets[0].data=history.map(x=>x.temperature);chart.data.datasets[1].data=history.map(x=>x.humidity);chart.data.datasets[2].data=history.map(x=>x.tvoc);chart.data.datasets[3].data=history.map(x=>x.eco2);chart.update('none')}catch(e){}}
 document.querySelectorAll('[data-hours]').forEach(b=>b.onclick=()=>loadLocalHistory(Number(b.dataset.hours)));loadLocalHistory(12);setInterval(()=>{const b=document.querySelector('[data-hours].active');loadLocalHistory(Number(b.dataset.hours))},60000);
}
setInterval(()=>{if(!isPages){$('clock').textContent=new Date().toLocaleTimeString('vi-VN')}},1000);
</script>
</body>
</html>
