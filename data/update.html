<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1418">
<title>Cập nhật firmware · Không Gian Xanh</title>
<style>
:root{--bg:#0b1418;--panel:#122027;--line:#29404a;--text:#eef7fa;--muted:#9db2ba;--accent:#65c8e8}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#081115,#0e1b21);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,sans-serif}.wrap{width:min(1120px,100%);margin:auto;padding:14px}.panel{background:rgba(18,32,39,.96);border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:0 8px 30px rgba(0,0,0,.16)}.sub{color:var(--muted);font-size:.82rem;margin-top:4px}.ota-frame{width:100%;height:560px;margin-top:14px;border:1px solid var(--line);border-radius:14px;background:#fff}@media(max-width:600px){.wrap{padding:10px}.panel{padding:12px}.ota-frame{height:620px}}
</style>
</head>
<body>
<main class="wrap">
<section class="panel">
<h1 style="margin:0;font-size:1.35rem">↻ Cập nhật firmware</h1>
<div class="sub">Trang OTA của ESP32. Hãy giữ nguồn ổn định trong khi cập nhật.</div>
<iframe class="ota-frame" src="/update" title="Cập nhật firmware OTA"></iframe>
</section>
</main>
</body>
</html>
