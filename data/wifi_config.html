<!DOCTYPE html>
<html lang="vi" data-bs-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cấu Hình WiFi - Không Gian Xanh</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  body{ font-family:'Be Vietnam Pro',sans-serif; background:#0d1117; min-height:100vh; }
  .card{ background:#161b22; border:1px solid #2a2f3a; border-radius:14px; }
  .form-control{ background:#0d1117; border-color:#2a2f3a; color:#e5e7eb; }
  .form-control:focus{ background:#0d1117; color:#e5e7eb; border-color:#4dabf7; box-shadow:0 0 0 .2rem rgba(77,171,247,.25); }
  a{ color:#4dabf7; }
  #msgBox{ display:none; }
</style>
</head>
<body class="d-flex align-items-center py-4">
<div class="container" style="max-width:480px;">

  <div class="text-center mb-4">
    <h3>📡 Cấu Hình WiFi</h3>
    <p class="text-secondary small">Không Gian Xanh</p>
  </div>

  <div class="card p-4">

    <div id="msgBox" class="alert" role="alert"></div>

    <form id="wifiForm">
      <div class="mb-3">
        <label class="form-label">Tên mạng WiFi (SSID)</label>
        <input type="text" class="form-control" id="ssid" name="ssid" placeholder="Nhập tên WiFi nhà bạn" required maxlength="32">
      </div>
      <div class="mb-3">
        <label class="form-label">Mật khẩu WiFi</label>
        <div class="input-group">
          <input type="password" class="form-control" id="password" name="password" placeholder="Để trống nếu mạng không có mật khẩu" maxlength="64">
          <button class="btn btn-outline-light" type="button" id="togglePass">👁</button>
        </div>
      </div>
      <button type="submit" class="btn btn-primary w-100" id="btnSave">Lưu &amp; Kết nối</button>
    </form>

    <hr class="border-secondary-subtle">

    <p class="text-secondary small mb-2">
      Sau khi lưu, ESP32 sẽ thử kết nối tới mạng WiFi trên trong khoảng 15 giây.
      Nếu thất bại, thiết bị sẽ tự động quay lại chế độ phát WiFi
      <strong>KhongGianXanh-Setup</strong> để bạn cấu hình lại.
    </p>

    <button type="button" class="btn btn-outline-danger btn-sm w-100" id="btnReset">
      Xoá cấu hình WiFi đã lưu
    </button>
  </div>

  <div class="text-center mt-3">
    <a href="/">← Quay lại Dashboard</a>
  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
document.getElementById('togglePass').addEventListener('click', () => {
  const pw = document.getElementById('password');
  pw.type = pw.type === 'password' ? 'text' : 'password';
});

function showMsg(text, type) {
  const box = document.getElementById('msgBox');
  box.className = 'alert alert-' + type;
  box.textContent = text;
  box.style.display = 'block';
}

document.getElementById('wifiForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = document.getElementById('btnSave');
  btn.disabled = true;
  btn.textContent = 'Đang lưu...';

  const formData = new URLSearchParams();
  formData.append('ssid', document.getElementById('ssid').value);
  formData.append('password', document.getElementById('password').value);

  try {
    const res = await fetch('/api/wifi-config', {
      method: 'POST',
      headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
      body: formData
    });
    const data = await res.json();
    if (data.ok) {
      showMsg('✅ Đã lưu cấu hình. ESP32 đang thử kết nối tới mạng mới. Nếu đổi mạng, bạn sẽ cần kết nối lại vào WiFi đó rồi truy cập dashboard.', 'success');
    } else {
      showMsg('❌ ' + (data.message || 'Có lỗi xảy ra.'), 'danger');
    }
  } catch (err) {
    showMsg('❌ Không thể kết nối tới ESP32. Vui lòng thử lại.', 'danger');
  } finally {
    btn.disabled = false;
    btn.textContent = 'Lưu & Kết nối';
  }
});

document.getElementById('btnReset').addEventListener('click', async () => {
  if (!confirm('Bạn có chắc muốn xoá cấu hình WiFi đã lưu? ESP32 sẽ chuyển về chế độ phát WiFi AP.')) return;
  try {
    const res = await fetch('/api/wifi-reset', { method: 'POST' });
    const data = await res.json();
    if (data.ok) {
      showMsg('✅ Đã xoá cấu hình. ESP32 đang chuyển sang chế độ AP (SSID: KhongGianXanh-Setup).', 'success');
    }
  } catch (err) {
    showMsg('❌ Không thể kết nối tới ESP32.', 'danger');
  }
});
</script>
</body>
</html>
