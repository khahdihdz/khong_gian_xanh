; ============================================================
;  PlatformIO Project Configuration File
;  Dự án: ESP32 - Giám sát môi trường phòng thời gian thực
; ============================================================

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino

; --- Tốc độ Serial & nạp code ---
monitor_speed = 115200
upload_speed = 921600

; --- Hệ thống file cho trang web (index.html, wifi_config.html) ---
board_build.filesystem = littlefs

; --- Partition scheme có khoảng trống cho OTA (bắt buộc để dùng ElegantOTA) ---
board_build.partitions = min_spiffs.csv

; --- Cờ biên dịch ---
build_flags =
    -D CORE_DEBUG_LEVEL=1
    -D ELEGANTOTA_USE_ASYNC_WEBSERVER=1

; --- Thư viện cần cài (PlatformIO tự tải theo Library Manager) ---
lib_deps =
    adafruit/DHT sensor library@^1.4.6
    adafruit/Adafruit Unified Sensor@^1.1.14
    adafruit/Adafruit GFX Library@^1.11.9
    adafruit/Adafruit SSD1306@^2.5.9
    sparkfun/SparkFun ENS160@^1.0.1
    ESP32Async/ESPAsyncWebServer@^3.1.0
    ESP32Async/AsyncTCP@^3.2.5
    ayushsharma82/ElegantOTA@^3.1.1

monitor_filters = esp32_exception_decoder, colorize
